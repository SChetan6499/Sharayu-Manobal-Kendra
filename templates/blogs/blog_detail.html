{% extends 'base.html' %}

{% load static %}

{% block title %}{{ blog.title }}{% endblock %}

{% block content %}

<section class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-10">

            <div class="blog-layout">

                <div class="blog-text-col">
                    {% if blog.image %}
                    <img id="blog-main-image" src="{{ blog.image.url }}" class="blog-floated-image rounded shadow mb-3"
                        alt="{{ blog.title }}">
                    {% endif %}

                    <h1 class="mb-3">{{ blog.title }}</h1>

                    <p class="text-muted">
                        <strong>Author:</strong> {{ blog.author }}
                        |
                        <strong>Published:</strong> {{ blog.created_at|date:"d M Y" }}
                    </p>

                    <hr>

                    <div class="blog-content">
                        {{ blog.content|linebreaks }}
                    </div>

                    <div class="mt-4">
                        <a href="{% url 'blog_list' %}" class="btn btn-primary">← Back to Blogs</a>
                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var img = document.getElementById('blog-main-image');
        if (!img) return;
        function applyOrientation() {
            var isLandscape = img.naturalWidth >= img.naturalHeight;
            if (isLandscape) {
                img.classList.remove('float-md-start');
                img.classList.add('float-md-end');
            } else {
                img.classList.remove('float-md-end');
                img.classList.add('float-md-start');
            }
        }
        if (img.complete && img.naturalWidth) applyOrientation();
        else img.addEventListener('load', applyOrientation);
    });
</script>

{% endblock %}
